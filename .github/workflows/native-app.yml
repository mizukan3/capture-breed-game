name: SDL3 native application
on:
  push:
    branches: ['native/**']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Compile SPIR-V
        run: |
          mkdir -p shader-build
          for shader in scene.vert scene.frag ui.vert ui.frag; do
            glslangValidator -V "native/assets/shaders/$shader" -o "shader-build/$shader.spv"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-shaders
          path: shader-build
  desktop:
    needs: shaders
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: native-shaders
          path: shader-build
      - name: Linux development packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libasound2-dev mesa-vulkan-drivers xvfb
      - name: Configure
        run: cmake -S . -B build-app -DCMAKE_BUILD_TYPE=Release -DCAPTURE_BUILD_APP=ON -DCAPTURE_SHADER_DIR="${{ github.workspace }}/shader-build"
      - name: Build
        run: cmake --build build-app --config Release --parallel 2
      - name: Core parity
        run: ctest --test-dir build-app -C Release --output-on-failure
      - name: Vulkan and Japanese text smoke test
        if: runner.os == 'Linux'
        env:
          SDL_AUDIODRIVER: dummy
          SDL_GPU_DRIVER: vulkan
        run: xvfb-run -a build-app/bin/capture-native --smoke-frames=8
      - name: Package
        run: cmake --install build-app --config Release --prefix dist
      - uses: actions/upload-artifact@v4
        with:
          name: capture-native-${{ runner.os }}-development
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-validation-${{ runner.os }}
          path: build-app/Testing/Temporary/LastTest.log
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure unsigned simulator build
        run: cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DCAPTURE_BUILD_APP=ON -DCAPTURE_BUILD_TESTS=OFF -DCAPTURE_ENABLE_IPO=OFF
      - name: Compile
        run: cmake --build build-ios --config Release --parallel 2
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build-ios/bin/Release/capture-native.app build-ios/CaptureBreedNative-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: capture-native-iOS-simulator-development
          if-no-files-found: error
          path: build-ios/CaptureBreedNative-simulator.zip
  android:
    needs: shaders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: SDK tools
        run: |
          sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.31.1"
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Prepare pinned SDL Java sources and assets
        run: |
          git init .native-deps/SDL
          git -C .native-deps/SDL fetch --depth 1 https://github.com/libsdl-org/SDL.git f00dc919ca35b9756316e86c4777392de442f9b2
          git -C .native-deps/SDL checkout --detach FETCH_HEAD
          node native/tools/prepare_mobile_assets.mjs build-mobile/assets
      - name: Assemble debug APK
        run: gradle -p native/platform/android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: capture-native-Android-development
          path: native/platform/android/app/build/outputs/apk/debug/*.apk
